name: Windows

on:
  push:
    branches: [ cmake ]
  pull_request:
    branches: [ cmake ]

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: 'recursive'

    # Visual C++ from the runner's Visual Studio, which CMake finds by itself. SDL 3 and
    # zlib are downloaded and built static by the game's CMake, and the SDL GPU shaders
    # are compiled with the Windows SDK's dxc.exe.
    - name: Configure CMake
      run: cmake -B build -A x64
    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}} --parallel

    # The linker writes the PDB, which the crash reporter reads names and lines from when
    # it sits beside the executable.
    - name: publish artifact
      uses: actions/upload-artifact@v4
      with:
        name: moonshine-runners-windows
        path: |
          build/MechoSoma/${{env.BUILD_TYPE}}/moonshine-runners.exe
          build/MechoSoma/${{env.BUILD_TYPE}}/moonshine-runners.pdb
        if-no-files-found: error
