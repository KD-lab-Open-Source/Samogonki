name: macOS

on:
  push:
    branches: [ cmake ]
  pull_request:
    branches: [ cmake ]

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: 'recursive'

    - name: Install dependencies
      run: brew install cmake ninja zlib

    # The SDL GPU shaders are compiled with SDL_shadercross, and building it means building
    # DXC (an LLVM fork) from source, since there is no prebuilt one for macOS. So the built
    # shadercross is cached with the libraries it loads, under the SDL_shadercross revision
    # the top-level CMakeLists.txt pins, and the game's build is given it with
    # -DSHADERCROSS_EXECUTABLE. This is VistaEngine's CI step.
    - name: Shadercross revision
      id: shadercross
      run: |
        revision=$(sed -n 's/.*set(SHADERCROSS_REVISION \([0-9a-f]*\)).*/\1/p' CMakeLists.txt)
        if [ -z "$revision" ]; then
          echo "SHADERCROSS_REVISION not found in CMakeLists.txt" >&2
          exit 1
        fi
        echo "revision=$revision" >> "$GITHUB_OUTPUT"

    - name: Restore shadercross
      id: cache-shadercross
      uses: actions/cache@v4
      with:
        path: ~/shadercross
        key: macos-shadercross-${{ runner.arch }}-${{ steps.shadercross.outputs.revision }}

    # Only the shadercross target, with three jobs: linking DXC needs a lot of memory. Its
    # libraries go in lib/ next to bin/, found through an added rpath. The build tree goes
    # before the test run, so that the copy can't load anything from it.
    - name: Build shadercross (not cached)
      if: steps.cache-shadercross.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        cmake -G Ninja -B build-shadercross -DCMAKE_BUILD_TYPE=Release
        cmake --build build-shadercross --target shadercross -j3
        cli=$(find build-shadercross -type f -perm -111 -name shadercross | head -1)
        if [ -z "$cli" ]; then
          echo "shadercross was built, but isn't in build-shadercross" >&2
          exit 1
        fi
        mkdir -p ~/shadercross/bin ~/shadercross/lib
        cp "$cli" ~/shadercross/bin/
        find build-shadercross \( -name libdxcompiler.dylib -o -name libdxil.dylib \) -exec cp {} ~/shadercross/lib/ \;
        install_name_tool -add_rpath @loader_path/../lib ~/shadercross/bin/shadercross
        if [ -f ~/shadercross/lib/libdxcompiler.dylib ]; then
          install_name_tool -add_rpath @loader_path ~/shadercross/lib/libdxcompiler.dylib
        fi
        rm -rf build-shadercross
        otool -L ~/shadercross/bin/shadercross
        ~/shadercross/bin/shadercross --help > /dev/null

    # One app for Apple Silicon and Intel, as the Steam build ships it.
    - name: Game -- configure
      run: >
        cmake -G Ninja -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -DSHADERCROSS_EXECUTABLE=$HOME/shadercross/bin/shadercross
        "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
    - name: Game -- build
      run: ninja
      working-directory: ${{github.workspace}}/build

    # Both architectures, and macOS 12 (the Steam client's minimum) in the program and its
    # Info.plist: the newest of the architectures' minimums counts.
    - name: Check the program's architectures and minimum macOS
      run: |
        set -euo pipefail
        app=${{github.workspace}}/build/MechoSoma/moonshine-runners.app
        bin="$app/Contents/MacOS/moonshine-runners"
        archs=$(lipo -archs "$bin")
        minos=$(vtool -show-build "$bin" | awk '$1 == "minos" { print $2 }' | sort -uV | tail -1)
        plist=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist" 2>/dev/null || true)
        echo "macOS: $archs, minimum macOS $minos, Info.plist ${plist:-without LSMinimumSystemVersion}" >> "$GITHUB_STEP_SUMMARY"
        for arch in arm64 x86_64; do
          case " $archs " in
            *" $arch "*) ;;
            *) echo "::error::the program is built for $archs, without $arch"; exit 1 ;;
          esac
        done
        if [ "$minos" != 12.0 ] || [ "$plist" != 12.0 ]; then
          echo "::error::the program needs macOS ${minos:-?} (Info.plist: ${plist:-none}), not 12.0, the Steam client's minimum"
          exit 1
        fi

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: moonshine-runners-macos
        path: build/MechoSoma/moonshine-runners.app
