name: Linux

on:
  push:
    branches: [ cmake ]
  pull_request:
    branches: [ cmake ]

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: 'recursive'

    - name: Install deps
      # SDL 3 is built by CMake (FetchContent); its X11 video driver needs the X11
      # extension headers. Not OpenGL's: SDL is built without it, as SDL GPU draws.
      run: sudo apt-get install libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libz-dev

    # The SDL GPU shaders are compiled with SDL_shadercross, which the build makes, with
    # Microsoft's prebuilt DXC (it needs glibc 2.38) and SPIRV-Cross built from source.
    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build -j3 --config ${{env.BUILD_TYPE}}

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: moonshine-runners-linux
        path: build/MechoSoma/moonshine-runners
